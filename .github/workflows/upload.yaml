name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      prefix: ${{ steps.asset-path.outputs.prefix }}
      base-url: ${{ steps.asset-path.outputs.base-url }}
      artifact-name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: Set up Calcit and Caps
      uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --ci
        yarn install --immutable

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        test -f calcit.cirru
        test -f deps.cirru
        test ! -e compact.cirru
        test ! -e package.cirru
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only

    - name: Select CDN asset path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Build web assets with CDN URLs
      run: |
        set -euo pipefail
        yarn build

    - name: Save tested frontend artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist
        if-no-files-found: error
        retention-days: 90

  upload:
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && 'pr' || 'production' }}
      cancel-in-progress: false
      queue: max
    steps:
    - name: Download tested frontend artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ needs.test.outputs.artifact-name }}
        path: dist

    - name: Reject superseded deployment
      id: deploy-head
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        DEPLOY_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        branch_path=$(jq -rn --arg branch "$DEPLOY_BRANCH" '$branch | @uri')
        response=$(curl --silent --show-error \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          --write-out '\n%{http_code}' \
          "$GITHUB_API_URL/repos/$DEPLOY_REPOSITORY/git/ref/heads/$branch_path")
        http_code="${response##*$'\n'}"
        response_body="${response%$'\n'*}"
        if [[ "$http_code" == "404" ]]; then
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping frontend deployment; branch no longer exists."
          exit 0
        fi
        if [[ "$http_code" != "200" ]]; then
          echo "::error::Cannot verify deployment branch HEAD (HTTP $http_code)."
          exit 1
        fi
        current_sha=$(printf '%s' "$response_body" | jq -er '.object.sha')
        if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping superseded frontend deployment; branch HEAD has changed."
        fi

    - name: Upload and verify static assets on COS
      if: steps.deploy-head.outputs.current == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ needs.test.outputs.prefix }}
        public-base-url: ${{ needs.test.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Install verified rsync
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        curl --fail --location --silent --show-error \
          --output "$RUNNER_TEMP/rsync.tar.gz" \
          https://download.samba.org/pub/rsync/src/rsync-3.4.4.tar.gz
        echo "bd88cf82fa653da32314fb229136407c5c90f80d1758d8f4b091767877d8fa96  $RUNNER_TEMP/rsync.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/rsync.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/rsync-3.4.4"
        ./configure \
          --prefix="$RUNNER_TEMP/rsync-install" \
          --disable-acl-support \
          --disable-lz4 \
          --disable-openssl \
          --disable-xattr-support \
          --disable-xxhash \
          --disable-zstd
        make -j2
        make install
        echo "$RUNNER_TEMP/rsync-install/bin" >> "$GITHUB_PATH"

    - name: Configure verified SSH host
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"
        printf '%s\n' 'tiye.me ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfDrFyoH0+6TL2+xhosnON6f0+/m9Iz8ydJLWMQQzsm' > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"

    - name: Upload web assets
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        rsync -avzr --progress \
          -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
          dist/* "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"
